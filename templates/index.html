<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Predictions Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .chart-container {
            transition: all 0.3s ease;
        }
        .loading-spinner {
            display: none;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4B5EAA;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .dark .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #93C5FD;
        }
        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th, .table-container td {
            padding: 12px;
            text-align: left;
        }
        .table-container th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <div class="container mx-auto p-4 sm:p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400">
                Machine Predictions Dashboard 
            </h1>
            <div class="flex space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                    <svg id="sun-icon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moon-icon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button id="refresh-button" class="p-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
        <div id="loading-spinner" class="loading-spinner"></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mb-6">
            <div class="chart-container bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                <canvas id="voltChart"></canvas>
            </div>
            <div class="chart-container bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                <canvas id="rotateChart"></canvas>
            </div>
            <div class="chart-container bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                <canvas id="pressureChart"></canvas>
            </div>
            <div class="chart-container bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                <canvas id="vibrationChart"></canvas>
            </div>
        </div>
        <div class="table-container bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4">
            <table class="min-w-full">
                <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="text-sm font-semibold text-gray-900 dark:text-gray-100">DateTime</th>
                        <th class="text-sm font-semibold text-gray-900 dark:text-gray-100">Volt</th>
                        <th class="text-sm font-semibold text-gray-900 dark:text-gray-100">Rotate</th>
                        <th class="text-sm font-semibold text-gray-900 dark:text-gray-100">Pressure</th>
                        <th class="text-sm font-semibold text-gray-900 dark:text-gray-100">Vibration</th>
                    </tr>
                </thead>
                <tbody id="predictions-table" class="divide-y divide-gray-200 dark:divide-gray-600">
                    <!-- Table rows will be populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize Chart.js instances
        const voltChart = new Chart(document.getElementById('voltChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Volt',
                    data: [],
                    borderColor: 'rgba(59, 130, 246, 1)', // Blue-500
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Volt Predictions Over Time', font: { size: 18, family: 'Inter' } }
                },
                scales: {
                    x: { title: { display: true, text: 'Time', font: { family: 'Inter' } } },
                    y: { title: { display: true, text: 'Volt', font: { family: 'Inter' } } }
                },
                animation: { duration: 1000, easing: 'easeInOutQuad' }
            }
        });

        const rotateChart = new Chart(document.getElementById('rotateChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Rotate',
                    data: [],
                    borderColor: 'rgba(239, 68, 68, 1)', // Red-500
                    backgroundColor: 'rgba(239, 68, 68, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Rotate Predictions Over Time', font: { size: 18, family: 'Inter' } }
                },
                scales: {
                    x: { title: { display: true, text: 'Time', font: { family: 'Inter' } } },
                    y: { title: { display: true, text: 'Rotate', font: { family: 'Inter' } } }
                },
                animation: { duration: 1000, easing: 'easeInOutQuad' }
            }
        });

        const pressureChart = new Chart(document.getElementById('pressureChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Pressure',
                    data: [],
                    borderColor: 'rgba(16, 185, 129, 1)', // Emerald-500
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Pressure Predictions Over Time', font: { size: 18, family: 'Inter' } }
                },
                scales: {
                    x: { title: { display: true, text: 'Time', font: { family: 'Inter' } } },
                    y: { title: { display: true, text: 'Pressure', font: { family: 'Inter' } } }
                },
                animation: { duration: 1000, easing: 'easeInOutQuad' }
            }
        });

        const vibrationChart = new Chart(document.getElementById('vibrationChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Vibration',
                    data: [],
                    borderColor: 'rgba(245, 158, 11, 1)', // Amber-500
                    backgroundColor: 'rgba(245, 158, 11, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 3,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Vibration Predictions Over Time', font: { size: 18, family: 'Inter' } }
                },
                scales: {
                    x: { title: { display: true, text: 'Time', font: { family: 'Inter' } } },
                    y: { title: { display: true, text: 'Vibration', font: { family: 'Inter' } } }
                },
                animation: { duration: 1000, easing: 'easeInOutQuad' }
            }
        });

        // Loading spinner and table body
        const spinner = document.getElementById('loading-spinner');
        const tableBody = document.getElementById('predictions-table');

        // Function to update charts and table with new data
        function updateChartsAndTable() {
            // spinner.style.display = 'block';
            fetch('/api/predictions')
                .then(response => response.json())
                .then(data => {
                    // Update Charts
                    const labels = data.map(row => new Date(row.datetime).toLocaleString());
                    const voltData = data.map(row => row.volt);
                    const rotateData = data.map(row => row.rotate);
                    const pressureData = data.map(row => row.pressure);
                    const vibrationData = data.map(row => row.vibration);

                    // Update Volt Chart
                    voltChart.data.labels = labels;
                    voltChart.data.datasets[0].data = voltData;
                    voltChart.update();

                    // Update Rotate Chart
                    rotateChart.data.labels = labels;
                    rotateChart.data.datasets[0].data = rotateData;
                    rotateChart.update();

                    // Update Pressure Chart
                    pressureChart.data.labels = labels;
                    pressureChart.data.datasets[0].data = pressureData;
                    pressureChart.update();

                    // Update Vibration Chart
                    vibrationChart.data.labels = labels;
                    vibrationChart.data.datasets[0].data = vibrationData;
                    vibrationChart.update();

                    // Update Table
                    tableBody.innerHTML = '';
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors';
                        tr.innerHTML = `
                            <td class="text-sm text-gray-900 dark:text-gray-100">${new Date(row.datetime).toLocaleString()}</td>
                            <td class="text-sm text-gray-900 dark:text-gray-100">${row.volt.toFixed(2)}</td>
                            <td class="text-sm text-gray-900 dark:text-gray-100">${row.rotate.toFixed(2)}</td>
                            <td class="text-sm text-gray-900 dark:text-gray-100">${row.pressure.toFixed(2)}</td>
                            <td class="text-sm text-gray-900 dark:text-gray-100">${row.vibration.toFixed(2)}</td>
                        `;
                        tableBody.appendChild(tr);
                    });

                    // spinner.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error fetching predictions:', error);
                    // spinner.style.display = 'none';
                });
        }

        // Initial fetch
        updateChartsAndTable();

        // Poll every 10 seconds for new data
        setInterval(updateChartsAndTable, 1000);

        // Manual refresh button
        document.getElementById('refresh-button').addEventListener('click', updateChartsAndTable);

        // Dark mode toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('sun-icon').classList.toggle('hidden', isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Load saved theme
        if (localStorage.getItem('theme') === 'dark' || 
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark');
            document.getElementById('sun-icon').classList.remove('hidden');
            document.getElementById('moon-icon').classList.add('hidden');
        }
    </script>
</body>
</html>
